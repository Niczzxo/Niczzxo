<svg xmlns="http://www.w3.org/2000/svg" width="540" height="330" viewBox="0 0 540 330">
<style>
  .ln { opacity: 1; animation: show 12s linear infinite; }
  @keyframes show { 0% { opacity: 0; } 1% { opacity: 1; } 90% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
  .l1 { animation-delay: 0s; } .l2 { animation-delay: 0s; } .l3 { animation-delay: 0s; }
  .l4 { animation-delay: 0s; } .l5 { animation-delay: 0s; } .l6 { animation-delay: 0s; } .l7 { animation-delay: 0s; }
  .d1 { animation-name: s1; } .d2 { animation-name: s2; } .d3 { animation-name: s3; }
  .d4 { animation-name: s4; } .d5 { animation-name: s5; } .d6 { animation-name: s6; } .d7 { animation-name: s7; }
  @keyframes s1 { 0% {opacity:0} 2% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s2 { 0% {opacity:0} 10% {opacity:0} 12% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s3 { 0% {opacity:0} 20% {opacity:0} 22% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s4 { 0% {opacity:0} 30% {opacity:0} 33% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s5 { 0% {opacity:0} 40% {opacity:0} 43% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s6 { 0% {opacity:0} 52% {opacity:0} 55% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  @keyframes s7 { 0% {opacity:0} 64% {opacity:0} 68% {opacity:1} 90% {opacity:1} 96% {opacity:0} 100% {opacity:0} }
  .cur { animation: blink 1s step-start infinite, s7 12s linear infinite; }
  @keyframes blink { 0% {opacity:1} 50% {opacity:0} 100% {opacity:1} }
  text { font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 15px; }
</style>
<rect width="540" height="330" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect width="540" height="34" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="64" cy="17" r="6" fill="#27c93f"/>
<text x="270" y="21" fill="#8b949e" font-size="12" text-anchor="middle">riyazul — zsh</text>
<text class="ln d1" x="22" y="72"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
<text class="ln d2" x="22" y="106" fill="#8b949e">riyazul.islam — full-stack developer</text>
<text class="ln d3" x="22" y="140"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat stack.ts</tspan></text>
<text class="ln d4" x="22" y="174"><tspan fill="#d2a8ff">const </tspan><tspan fill="#e6edf3">stack = [</tspan><tspan fill="#ffa657">'React'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffa657">'TypeScript'</tspan><tspan fill="#e6edf3">,</tspan></text>
<text class="ln d5" x="40" y="208"><tspan fill="#ffa657">'Node.js'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffa657">'Supabase'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffa657">'MongoDB'</tspan><tspan fill="#e6edf3">];</tspan></text>
<text class="ln d6" x="22" y="242"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">npm run ship -- cashskillbd</tspan></text>
<text class="ln d7" x="22" y="276"><tspan fill="#8b949e">&gt;&gt; building... deploying... </tspan><tspan fill="#3fb950" font-weight="bold">LIVE</tspan></text>
<rect class="cur" x="330" y="263" width="9" height="16" fill="#3fb950"/>
</svg>
